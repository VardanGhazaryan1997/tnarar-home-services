# Local development infrastructure. Start with:  docker compose up -d
# Credentials come from .env (copy .env.example to .env first).
name: home-services

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_services}
      POSTGRES_USER: ${POSTGRES_USER:-home_services}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 on the host so a locally installed PostgreSQL (5432) does not clash
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # S3-compatible file storage for photos, videos and documents (SeaweedFS).
    # Optional until task T24 needs it:  docker compose --profile storage up -d
    # S3 API: http://localhost:8333   Credentials: infra/seaweedfs/s3.json (development only)
    image: chrislusf/seaweedfs:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${STORAGE_S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seq:
    # Structured log viewer: http://localhost:5341 (the API sends logs here from task T03).
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  storage-data:
  seq-data:
